<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report an Issue & AI Support</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --background: #f8fafc;
            --text: #1e293b;
            --card-bg: #ffffff;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--background);
            color: var(--text);
            line-height: 1.5;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            width: 100%;
            max-width: 1100px;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .card-header {
            background: var(--primary);
            color: white;
            padding: 20px;
            font-size: 1.25rem;
            font-weight: 600;
        }

        /* Form Styling */
        .form-body {
            padding: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 0.9rem;
        }

        input, textarea, select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, textarea:focus, select:focus {
            border-color: var(--primary);
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            width: 100%;
            transition: background 0.2s;
        }

        button:hover {
            background: var(--primary-hover);
        }

        /* Chatbot Styling */
        .chat-container {
            height: 500px;
            display: flex;
            flex-direction: column;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: #f1f5f9;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.95rem;
        }

        .message.bot {
            background: white;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .message.user {
            background: var(--primary);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .chat-input-area {
            display: flex;
            padding: 15px;
            gap: 10px;
            border-top: 1px solid var(--border);
            background: white;
        }

        .chat-input-area input {
            flex: 1;
        }

        .chat-input-area button {
            width: auto;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Left Column: Issue Report Form -->
    <div class="card">
        <div class="card-header">📋 Report an Issue</div>
        <form class="form-body" id="issueForm">
            <div class="form-group">
                <label for="name">Your Name</label>
                <input type="text" id="name" required placeholder="John Doe">
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" required placeholder="john@example.com">
            </div>
            <div class="form-group">
                <label for="category">Issue Category</label>
                <select id="category">
                    <option value="technical">Technical Bug</option>
                    <option value="billing">Billing & Account</option>
                    <option value="feature">Feature Request</option>
                    <option value="other">Other</option>
                </select>
            </div>
            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" rows="5" required placeholder="Describe the problem in detail..."></textarea>
            </div>
            <button type="submit">Submit Ticket</button>
        </form>
    </div>

    <!-- Right Column: AI Chatbot -->
    <div class="card">
        <div class="card-header">🤖 AI Support Assistant</div>
        <div class="chat-container">
            <div class="chat-messages" id="chatMessages">
                <div class="message bot">
                    Hello! I am your AI assistant. Tell me briefly what issue you are experiencing, and I'll try to help or guide you!
                </div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="chatInput" placeholder="Type your question here..." onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>
</div>

<script>
    // Free, no-auth client-side API built on duckduckgo's parsing engine for basic answers
    // Uses a serverless text generation pipeline
    async function fetchAIResponse(userText) {
        try {
            // Formatting system constraints into the prompt
            const prompt = `You are a helpful customer support AI. Keep answers short, direct, and under 3 sentences. Help the user solve this problem: "${userText}"`;
            
            const response = await fetch('https://pollinations.ai' + encodeURIComponent(prompt));
            if (!response.ok) throw new Error('API Error');
            return await response.text();
        } catch (error) {
            console.error(error);
            return "I'm having trouble connecting to my brain right now. Please fill out the form on the left, and our human team will review it!";
        }
    }

    // Chat Interface Logic
    const chatMessages = document.getElementById('chatMessages');
    const chatInput = document.getElementById('chatInput');

    async function sendMessage() {
        const text = chatInput.value.trim();
        if (!text) return;

        // Append User Message
        appendMessage(text, 'user');
        chatInput.value = '';

        // Append Loading State
        const loadingId = appendMessage('Thinking...', 'bot');

        // Fetch Response from API
        const aiResponse = await fetchAIResponse(text);

        // Update Loading Message with actual AI Response
        document.getElementById(loadingId).innerText = aiResponse;
    }

    function appendMessage(text, sender) {
        const msgDiv = document.createElement('div');
        const id = 'msg-' + Date.now();
        msgDiv.className = `message ${sender}`;
        msgDiv.id = id;
        msgDiv.innerText = text;
        chatMessages.appendChild(msgDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
        return id;
    }

    function handleKeyPress(event) {
        if (event.key === 'Enter') {
            sendMessage();
        }
    }

    // Form Handling Logic
    document.getElementById('issueForm').addEventListener('submit', function(e) {
        e.preventDefault();
        alert('Thank you! Your issue ticket has been logged successfully. Our team will contact you via email.');
        this.reset();
    });
</script>

</body>
</html>
