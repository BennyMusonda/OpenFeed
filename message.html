<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message</title>
    <link rel="stylesheet" href="message.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>

    <!-- Main Chat Workspace Container -->
    <div class="chat-container">

        <!-- Left Sidebar: Users List -->
        <div class="chat-sidebar">
            <div class="sidebar-header">Chats</div>
            <div class="user-list" id="userList">
                <!-- JavaScript will inject users here dynamically -->
            </div>
        </div>

        <!-- Right Main Box: Active Chat Screen -->
        <div class="chat-window">
            
            <!-- Default screen before clicking a user -->
            <div class="chat-placeholder" id="chatPlaceholder">
                <h2>Select a chat to start messaging</h2>
            </div>

            <!-- Active Conversation Area (switched on by JS) -->
            <div class="chat-active-box" id="chatActiveBox">
                
                <!-- Header displaying current user chat -->
                <div class="chat-header">
                    <div class="user-avatar" id="activeAvatar">?</div>
                    <div class="user-name" id="activeName">User Name</div>
                </div>

                <!-- Scrollable screen for message bubbles -->
                <div class="chat-messages" id="chatMessages">
                    <!-- JavaScript will inject message bubbles here -->
                </div>

                <!-- Form to type and send messages -->
                <div class="chat-input-area">
                    <input type="text" id="messageInput" class="chat-input" placeholder="Type a message..." autocomplete="off">
                    <button id="sendBtn" class="send-btn">Send</button>
                </div>

            </div>
        </div>

    </div>

    
  

   <script src="message.js" defer></script>
</body>
</html>
