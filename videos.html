<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reels Feed</title>
  <link rel="stylesheet" href="videos.css">
  <!-- Feather Icons for clean UI symbols -->
  <script src="https://unpkg.com/feather-icons"></script>
</head>
<body>

  <!-- Navigation Bar-->
  <nav class="navbar">
    <div class="nav-left">
      <a href="index.html" class="logo">Home</a>
    </div>
  </nav>

  <!-- Main Feed Container -->
  <main class="reels-container">

    <!-- REEL ITEM 1 -->
    <section class="reel">
      <!-- Background Video -->
      <video 
        class="reel-video" 
        src="vids/reel2.mp4" 
        loop 
        muted 
        autoplay 
        playsinline>
      </video>

      <!-- Gradient Overlay for Contrast -->
      <div class="reel-overlay"></div>

      <!-- Left Bottom Info (User & Caption) -->
      <div class="reel-content">
        <div class="user-info">
          <img src="imgs/Friend-Picture.jpg" alt="Profile" class="avatar">
          <span class="username">benny_musondah</span>
          <button class="follow-btn">Follow</button>
        </div>
        
        <p class="caption">so eneretic wow!! #nature #vibes #outdoors</p>
        
        <div class="audio-track">
          <i data-feather="music" class="music-icon"></i>
          <div class="audio-ticker">
            <span>benny_musondah • Original Audio</span>
          </div>
        </div>
      </div>

      <!-- Right Action Sidebar -->
      <div class="reel-actions">
        <button class="action-btn">
          <i data-feather="heart"></i>
          <span>124.5K</span>
        </button>
        
        <button class="action-btn">
          <i data-feather="message-circle"></i>
          <span>1,820</span>
        </button>
        
        <button class="action-btn">
          <i data-feather="send"></i>
          <span>Share</span>
        </button>
        
        <button class="action-btn">
          <i data-feather="bookmark"></i>
        </button>

        <div class="audio-disc">
          <img src="imgs/headphones.jpg" alt="Audio Disc">
        </div>
      </div>
    </section>

    <!-- REEL ITEM 2 -->
    <section class="reel">
      <video 
        class="reel-video" 
        src="vids/reel1.mp4" 
        loop 
        muted 
        playsinline>
      </video>

      <div class="reel-overlay"></div>

      <div class="reel-content">
        <div class="user-info">
          <img src="imgs/Post-Content2.png" alt="Profile" class="avatar">
          <span class="username">katongo_jnr</span>
          <button class="follow-btn">Follow</button>
        </div>
        
        <p class="caption">very nice eish #zambia #lusaka #cyberpunk</p>
        
        <div class="audio-track">
          <i data-feather="music" class="music-icon"></i>
          <div class="audio-ticker">
            <span>Witty Beats • Night City</span>
          </div>
        </div>
      </div>

      <div class="reel-actions">
        <button class="action-btn">
          <i data-feather="heart"></i>
          <span>89.2K</span>
        </button>
        
        <button class="action-btn">
          <i data-feather="message-circle"></i>
          <span>942</span>
        </button>
        
        <button class="action-btn">
          <i data-feather="send"></i>
          <span>Share</span>
        </button>
        
        <button class="action-btn">
          <i data-feather="bookmark"></i>
        </button>

        <div class="audio-disc">
          <img src="imgs/Post-Content1.png" alt="Audio Disc">
        </div>
      </div>
    </section>

  </main>

  <!-- Initialize Feather Icons -->
  <script  defer src="videos.js">
    feather.replace();
  </script>
</body>
</html>
