<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market</title>
    <link rel="stylesheet" href="market.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>

    <nav class="navbar">
        <div class="nav-left">
            <h1>OpenFeed</h1>
            <input class="searchBar" type="text" placeholder="Search...">
        </div>
        <ul class="nav-links">
            <li class="nav-item">
                <a href="index.html" class="nav-link active">
                    <span class="material-icons">home</span>
                </a>
            </li>                                                                                                                                                                                                                                                                                                                                                                                                                           
            <li class="nav-item">
                <a href="videos.html" class="nav-link">
                    <span class="material-icons">play_circle</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="market.html" class="nav-link">
                    <span class="material-icons">shopping_cart</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="message.html" class="nav-link">
                    <span class="material-icons">message</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="notification.html" class="nav-link">
                    <span class="material-icons">notifications</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="person.html" class="nav-link">
                    <span class="material-icons">person</span>
                </a>
            </li>
        </ul>
    </nav>

   <!-- Main Market Section Container -->
  <main class="market-container">
    
    <!-- Sidebar for Filters -->
    <aside class="market-sidebar">
      <h3>Categories</h3>
      <ul class="filter-list">
        <li><button class="filter-btn active" data-category="all">All Items</button></li>
        <li><button class="filter-btn" data-category="electronics">Electronics</button></li>
        <li><button class="filter-btn" data-category="clothing">Clothing</button></li>
        <li><button class="filter-btn" data-category="books">Books</button></li>
      </ul>
    </aside>

    <!-- Product Grid Feed -->
    <section class="market-feed">
      
      <!-- Card 1 -->
      <div class="product-card" data-category="electronics">
        <div class="product-image">
          <img src="imgs/headphones.jpg" alt="Wireless Headphones">
        </div>
        <div class="product-info">
          <h4 class="product-title">Wireless Headphones</h4>
          <p class="product-price">$99.00</p>
          <p class="product-seller">Posted by: @alex_tech</p>
          <div class="card-actions">
            <button class="btn-msg">Message Seller</button>
            <button class="btn-fav">♥</button>
          </div>
        </div>
      </div>

      <!-- Card 2 -->
      <div class="product-card" data-category="clothing">
        <div class="product-image">
          <img src="imgs/jacket.jpg" alt="Vintage Jacket">
        </div>
        <div class="product-info">
          <h4 class="product-title">Vintage Denim Jacket</h4>
          <p class="product-price">$45.00</p>
          <p class="product-seller">Posted by: @vintage_vibes</p>
          <div class="card-actions">
            <button class="btn-msg">Message Seller</button>
            <button class="btn-fav">♥</button>
          </div>
        </div>
      </div>

      <!-- Card 3 -->
      <div class="product-card" data-category="books">
        <div class="product-image">
          <img src="img/novels.jpg" alt="Sci-Fi Novel">
        </div>
        <div class="product-info">
          <h4 class="product-title">Sci-Fi Novel Collection</h4>
          <p class="product-price">$15.00</p>
          <p class="product-seller">Posted by: @bookworm99</p>
          <div class="card-actions">
            <button class="btn-msg">Message Seller</button>
            <button class="btn-fav">♥</button>
          </div>
        </div>
      </div>

    </section>
  </main>

   <script src="market.js" defer></script>
</body>
</html>
